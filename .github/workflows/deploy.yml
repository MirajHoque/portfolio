name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify security headers are current
        run: python3 scripts/generate-csp.py --check
      - name: Check internal links
        run: bash scripts/check-links.sh
      - name: Prepare artifact
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' \
                   --exclude '.git' \
                   --exclude '.github' \
                   --exclude 'scripts' \
                   --exclude 'Makefile' \
                   --exclude 'README.md' \
                   ./ _site/
          # GitHub Pages does not serve dotfiles that Jekyll would process.
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
